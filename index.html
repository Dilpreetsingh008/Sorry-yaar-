<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sorry Yaar 😭</title>
<style>
  *{box-sizing:border-box}
  body{
    margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
    font-family:Arial,sans-serif; background:linear-gradient(135deg,#ffd6e7,#e6d9ff);
    overflow:hidden;
  }
  .card{
    width:min(90%,420px); padding:42px 25px; text-align:center;
    background:rgba(255,255,255,.82); border-radius:28px;
    box-shadow:0 15px 45px rgba(0,0,0,.15);
  }
  .emoji{font-size:64px}
  h1{font-size:38px;margin:12px 0 8px}
  p{font-size:20px;color:#555;margin:0}
  button{
    margin-top:25px;border:0;border-radius:999px;padding:13px 25px;
    font-size:17px;background:#111;color:#fff;cursor:pointer;
  }
  #heart{position:fixed;bottom:-30px;font-size:25px;animation:up 3s linear forwards}
  @keyframes up{to{transform:translateY(-110vh) rotate(25deg);opacity:0}}
</style>
</head>
<body>
<div class="card">
  <div class="emoji">🥺</div>
  <h1>Sorry yaar 😭</h1>
  <p>Gussa mat hona... meri galti thi ❤️</p>
  <button onclick="forgive()">Okay, maaf kiya 😌</button>
</div>
<script>
function forgive(){
  for(let i=0;i<18;i++){
    const h=document.createElement('div');
    h.id='heart'; h.textContent=['❤️','💗','💖','🥹'][Math.floor(Math.random()*4)];
    h.style.left=Math.random()*100+'vw';
    h.style.animationDelay=Math.random()*.8+'s';
    document.body.appendChild(h);
    setTimeout(()=>h.remove(),3500);
  }
}
</script>
</body>
</html>
